services:
  - type: web
    name: weather-app-backend
    runtime: node
    plan: free
    buildCommand: cd backend && npm ci && npm run build
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: SUPABASE_URL
        scope: build,runtime
      - key: SUPABASE_ANON_KEY
        scope: build,runtime
    healthCheckPath: /health
